name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Generate app icons
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('src-tauri/icons');p.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(19,38,57,255))
          d=ImageDraw.Draw(im)
          d.arc((22,22,234,234),180,360,fill=(95,220,242),width=11)
          d.line((22,128,234,128),fill=(255,255,255),width=7)
          d.line((128,128,206,46),fill=(255,184,73),width=12)
          d.ellipse((117,117,139,139),fill=(255,184,73))
          im.save(p/'icon.png'); im.save(p/'icon.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Floating-Protractor-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
