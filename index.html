<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floating Protractor</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header id="bar" data-tauri-drag-region><span class="grip" data-tauri-drag-region>⠿</span><strong data-tauri-drag-region>ANGLE LAB</strong><span class="sub" data-tauri-drag-region>floating protractor</span><button id="top" title="Always on top">📌</button><button id="min" title="Minimise">−</button><button id="close" title="Close">×</button></header>
<nav><button id="mode180" class="active">180°</button><button id="mode360">360°</button><span class="separator"></span><button id="show" class="active">Show angle</button><button id="lock">🔓 Free</button><button id="reset">↺ Reset</button></nav>
<main><svg id="dial" viewBox="0 0 500 455" aria-label="Interactive angle measuring protractor"><g id="rotated" transform="translate(250 229)"><g id="scale"></g><g id="reference"></g><g id="arc"></g><g id="arm"></g><circle id="pivot" r="10" fill="#ffb84d" stroke="#fff" stroke-width="3"/><circle r="3" fill="#2d3748" pointer-events="none"/></g></svg><div id="readout"><span id="degree">60°</span><small id="angleKind">Acute angle</small></div></main>
<footer><label>Rotate dial <input id="rotation" type="range" min="-180" max="180" step="1" value="0"></label><span id="rotationNum">0°</span><label class="setter">Set angle <input id="target" type="number" min="0" max="180" value="60" step="1"></label><button id="apply">Set</button></footer><div class="help">Orange handle: measure · Blue ↻ handle: rotate around base centre · Drag title bar: move window</div></div>
<script type="module" src="/app.js"></script></body></html>
